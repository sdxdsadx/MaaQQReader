# QQReader 本机配置示例（占位值，复制为 configs/qqreader.yaml 后按机器填写）
# 统一 UTF-8；路径支持中文与空格。真实密钥/账号不要写进仓库。
version: 1

machine:
  adb_path: "C:\\path\\to\\adb.exe"
  adb_address: "127.0.0.1:16384"
  package_name: "com.qq.reader"
  emulator_path: "C:\\path\\to\\MuMuPlayer.exe"
  python_executable: "C:\\path\\to\\python.exe"
  resolution: [720, 1280]
  screenshot_dir: "runtime/screenshots"
  log_dir: "runtime/logs"
  record_dir: "runtime/records"
  # MaaFramework 运行时（含 MaaFramework.dll 与各 ControlUnit 依赖）
  maa_runtime_dir: "C:\\path\\to\\MaaFramework"
  maa_resource_dir: "C:\\path\\to\\MaaFramework\\resource"
  maa_agent_dir: "C:\\path\\to\\MaaFramework\\MaaAgentBinary"
  maa_controller: "adb"       # adb（真机/模拟器）| custom（静态截图，离线）
  maa_short_side: 720         # 旧工程用 720 保持坐标体系；null 表示不缩放
  maa_custom_dir: null        # controller=custom 时的截图目录

captcha:
  solver: "manual"          # manual | ddddocr | slide | auto
  max_attempts: 2
  verify_frames: 3
  verify_interval_seconds: 1.0
  slide_roi: null           # [x, y, w, h]，实机标定后再填

tasks:
  DailyAdFlow:
    enabled: true
    timeout_seconds: 2700
    retry: 3
    feature_overrides: {}
  DailyGameFlow:
    enabled: true
    timeout_seconds: 1800
    retry: 3
    feature_overrides: {}
